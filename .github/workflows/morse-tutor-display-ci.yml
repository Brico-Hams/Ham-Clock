name: Morse Tutor display CI

on:
  push:
    branches: ["fix/morse-tutor-display-refresh"]
    paths:
      - "morse-tutor/**"
      - ".github/workflows/morse-tutor-display-ci.yml"
  pull_request:
    paths:
      - "morse-tutor/**"
      - ".github/workflows/morse-tutor-display-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: tutor-pio-${{ runner.os }}-${{ hashFiles('morse-tutor/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Compile all Morse Tutor boards and native tests
        working-directory: morse-tutor
        run: |
          python -m platformio run -e esp32-2432s028r -e esp32-2432s028r-st7789 -e esp32-4in-st7796 -e freenove-32-st7789
          for panel in 9341 7789 7796 778932; do
            g++ -std=c++11 -fsyntax-only -I include -DBRICO_PANEL=$panel test/control_logic.cpp
          done
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/protocol_morse.cpp -o /tmp/morse-protocol-tests
          /tmp/morse-protocol-tests
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/training.cpp -o /tmp/morse-training-tests
          /tmp/morse-training-tests
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I src -I test/support test/trainer_settings.cpp src/trainer_settings.cpp -o /tmp/morse-settings-tests
          /tmp/morse-settings-tests
      - name: Validate startup branding and configurable callsign
        run: node morse-tutor/tools/validate-branding.mjs
