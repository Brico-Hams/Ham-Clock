name: Web Flasher

on:
  push:
    tags: ["v*"]
    branches: ["main"]
    paths:
      - "morse-tutor/**"
      - "webflasher/**"
      - "platformio.ini"
      - "src/**"
      - "include/**"
      - "tools/build_webflasher.py"
      - ".github/workflows/webflasher.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'morse-tutor/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      # app_config.h is committed; the local override is optional and ignored.
      - name: Build firmware and manifests
        run: python tools/build_webflasher.py --build

      - name: Build independent Morse Tutor
        working-directory: morse-tutor
        run: |
          python -m platformio run -e esp32-2432s028r -e esp32-2432s028r-st7789 -e esp32-4in-st7796 -e freenove-32-st7789
          for panel in 9341 7789 7796 778932; do
            g++ -std=c++11 -fsyntax-only -I include -DBRICO_PANEL=$panel test/control_logic.cpp
          done
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/protocol_morse.cpp -o /tmp/bricohams-morse-tests
          /tmp/bricohams-morse-tests
          g++ -std=c++11 -Wall -Wextra -Werror -I include test/training.cpp -o /tmp/bricohams-training-tests
          /tmp/bricohams-training-tests
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I src -I test/support test/trainer_settings.cpp src/trainer_settings.cpp -o /tmp/bricohams-settings-tests
          /tmp/bricohams-settings-tests
          node tools/generate-adapter.mjs
          node tools/validate-models.mjs
          node tools/validate-models.mjs --family
          node tools/package-firmware.mjs

      - name: Stage Morse Tutor installer
        run: |
          node morse-tutor/tools/stage-installer.mjs
          node morse-tutor/tools/validate-release.mjs
          node morse-tutor/tools/validate-documentation.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
