<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 900"><rect width="1100" height="900" fill="white"/><g font-family="monospace" fill="black"><text x="30" y="30" font-size="24">Bricohams wired adapter R1 - connectivity schematic</text><rect x="30" y="65" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="87" font-size="14">J1 CYD wire pads, 5 mm pitch</text><text x="40" y="107" font-size="10">pin 1: GND (6, 7 mm)</text><text x="40" y="116" font-size="10">pin 2: 3V3 (6, 12 mm)</text><text x="40" y="125" font-size="10">pin 3: GPIO_DIT (6, 17 mm)</text><text x="40" y="134" font-size="10">pin 4: GPIO_DAH (6, 22 mm)</text><text x="40" y="143" font-size="10">pin 5: AUDIO_PWM (6, 27 mm)</text><text x="40" y="152" font-size="10">pin 6: 5V (6, 32 mm)</text><rect x="570" y="65" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="87" font-size="14">J2 External KEY: sleeve, tip, ring</text><text x="580" y="107" font-size="10">pin 1: GND (74, 7 mm)</text><text x="580" y="116" font-size="10">pin 2: KEY_DIT (74, 17 mm)</text><text x="580" y="125" font-size="10">pin 3: KEY_DAH (74, 22 mm)</text><rect x="30" y="180" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="202" font-size="14">J3 Integrated paddle contacts: common, dit, dah</text><text x="40" y="222" font-size="10">pin 1: GND (65, 7 mm)</text><text x="40" y="231" font-size="10">pin 2: KEY_DIT (65, 17 mm)</text><text x="40" y="240" font-size="10">pin 3: KEY_DAH (65, 22 mm)</text><rect x="570" y="180" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="202" font-size="14">R1 1k, axial 10 mm</text><text x="580" y="222" font-size="10">pin 1: GPIO_DIT (20, 17 mm)</text><text x="580" y="231" font-size="10">pin 2: KEY_DIT (30, 17 mm)</text><rect x="30" y="295" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="317" font-size="14">R2 1k, axial 10 mm</text><text x="40" y="337" font-size="10">pin 1: GPIO_DAH (20, 22 mm)</text><text x="40" y="346" font-size="10">pin 2: KEY_DAH (30, 22 mm)</text><rect x="570" y="295" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="317" font-size="14">R3 10k, axial 10 mm</text><text x="580" y="337" font-size="10">pin 1: 3V3 (40, 7 mm)</text><text x="580" y="346" font-size="10">pin 2: KEY_DIT (40, 17 mm)</text><rect x="30" y="410" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="432" font-size="14">R4 10k, axial 10 mm</text><text x="40" y="452" font-size="10">pin 1: 3V3 (50, 12 mm)</text><text x="40" y="461" font-size="10">pin 2: KEY_DAH (50, 22 mm)</text><rect x="570" y="410" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="432" font-size="14">C1 10nF, 5 mm</text><text x="580" y="452" font-size="10">pin 1: KEY_DIT (34, 12 mm)</text><text x="580" y="461" font-size="10">pin 2: GND (34, 7 mm)</text><rect x="30" y="525" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="547" font-size="14">C2 10nF, 5 mm</text><text x="40" y="567" font-size="10">pin 1: KEY_DAH (56, 22 mm)</text><text x="40" y="576" font-size="10">pin 2: GND (56, 27 mm)</text><rect x="570" y="525" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="547" font-size="14">R5 10k, axial 10 mm</text><text x="580" y="567" font-size="10">pin 1: AUDIO_PWM (20, 27 mm)</text><text x="580" y="576" font-size="10">pin 2: ATTENUATED (30, 27 mm)</text><rect x="30" y="640" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="662" font-size="14">R6 1k, vertical axial 5 mm</text><text x="40" y="682" font-size="10">pin 1: ATTENUATED (40, 27 mm)</text><text x="40" y="691" font-size="10">pin 2: GND (40, 32 mm)</text><rect x="570" y="640" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="662" font-size="14">C3 1uF nonpolar film, 5 mm</text><text x="580" y="682" font-size="10">pin 1: ATTENUATED (46, 27 mm)</text><text x="580" y="691" font-size="10">pin 2: LINE_OUT (51, 27 mm)</text><rect x="30" y="755" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="40" y="777" font-size="14">J4 Active speaker: signal, ground</text><text x="40" y="797" font-size="10">pin 1: LINE_OUT (74, 27 mm)</text><text x="40" y="806" font-size="10">pin 2: GND (74, 32 mm)</text><rect x="570" y="755" width="510" height="100" fill="#eef5ff" stroke="black"/><text x="580" y="777" font-size="14">J5 External amp: 5V, GND, IN</text><text x="580" y="797" font-size="10">pin 1: 5V (60, 32 mm)</text><text x="580" y="806" font-size="10">pin 2: GND (65, 32 mm)</text><text x="580" y="815" font-size="10">pin 3: LINE_OUT (70, 32 mm)</text><text x="30" y="885" font-size="14">Same net labels are electrically connected. No RF keying output. No battery charging circuit.</text></g></svg>