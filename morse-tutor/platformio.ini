[platformio]
default_envs = esp32-2432s028r

[env]
platform = espressif32@6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps = bodmer/TFT_eSPI@2.5.43
extra_scripts = post:tools/export_boot_image.py
build_flags =
    -D USER_SETUP_LOADED=1
    -include include/BoardConfig.h

[env:esp32-2432s028r]
build_flags =
    ${env.build_flags}
    -D BRICO_PANEL=9341

[env:esp32-2432s028r-st7789]
build_flags =
    ${env.build_flags}
    -D BRICO_PANEL=7789

[env:esp32-4in-st7796]
build_flags =
    ${env.build_flags}
    -D BRICO_PANEL=7796

[env:freenove-32-st7789]
build_flags =
    ${env.build_flags}
    -D BRICO_PANEL=778932
